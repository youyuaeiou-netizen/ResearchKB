name: Bug report
description: 报告可复现的脚本、配置或边界错误
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题与预期行为
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 请删除凭据、个人笔记、PDF 和私有研究数据。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows、PowerShell 与 Python 版本
    validations:
      required: true
