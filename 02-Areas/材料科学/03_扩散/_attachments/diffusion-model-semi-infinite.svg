<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">恒定表面浓度的半无限扩散体</text>
  <text x="550" y="76" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">表面由远距离扩散源维持 ρₛ，基体初始浓度为 ρ₀</text>

  <rect x="120" y="150" width="110" height="160" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <rect x="230" y="150" width="700" height="160" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <line x1="230" y1="132" x2="230" y2="330" stroke="#0f172a" stroke-width="4"/>
  <text x="175" y="205" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#9a3412">扩散源</text>
  <text x="175" y="245" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#7c2d12">ρ = ρₛ</text>
  <text x="580" y="205" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#1d4ed8">半无限基体</text>
  <text x="580" y="245" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#1e3a8a">t = 0：ρ = ρ₀</text>
  <text x="230" y="115" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">表面 x = 0</text>
  <text x="930" y="345" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#475569">x → ∞</text>
  <line x1="275" y1="360" x2="880" y2="360" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="575" y="395" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#115e59">扩散进入基体，固定边界 ρ(0,t) = ρₛ</text>

  <rect x="150" y="445" width="800" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="550" y="484" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">远处边界 ρ(x→∞,t) = ρ₀；浓度变化区的特征深度随 √(Dt) 增长</text>
</svg>
