<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
  <title id="title">平面源的高斯浓度分布</title>
  <desc id="desc">平面源总量保持不变，随着时间增加浓度峰降低而分布变宽。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="760" height="450" fill="white"/>
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="80" y1="365" x2="700" y2="365" marker-end="url(#arrow)"/>
    <line x1="380" y1="410" x2="380" y2="55" marker-end="url(#arrow)"/>
    <path d="M105 365 C255 365 300 355 335 280 C360 225 370 100 380 78 C390 100 400 225 425 280 C460 355 505 365 655 365" stroke-width="3"/>
    <path d="M105 365 C205 365 250 350 295 315 C340 280 360 205 380 180 C400 205 420 280 465 315 C510 350 555 365 655 365" stroke-width="3"/>
    <line x1="380" y1="365" x2="380" y2="75" stroke-dasharray="7 6"/>
  </g>
  <g fill="#111" font-family="sans-serif" font-size="23">
    <text x="55" y="72">ρ</text>
    <text x="686" y="399">x</text>
    <text x="395" y="95">x = 0，平面源</text>
    <text x="430" y="120">t₁</text>
    <text x="480" y="220">t₂</text>
    <text x="115" y="420">总量 ∫ρdx = M 保持不变</text>
    <text x="500" y="80">峰值降低，分布变宽</text>
  </g>
</svg>
