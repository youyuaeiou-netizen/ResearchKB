{
  "schema": "researchkb-source-registry/v1",
  "format": "JSON-compatible YAML",
  "updated_at": "2026-08-17",
  "timezone": "Asia/Shanghai",
  "schedules": {
    "daily_collection": "07:30",
    "weekly_review": "Sunday 20:00",
    "v3_weekly_review": "Sunday 20:00",
    "horizon_weekly_digest": "Sunday 12:00",
    "legacy_schedule_aliases": {
      "weekly_review": "v3_weekly_review"
    }
  },
  "lookback_days": 7,
  "max_items_per_source": 20,
  "network_timeout_seconds": 20,
  "codex": {
    "enabled_by_flag": true,
    "cli_path": "codex",
    "model": "",
    "timeout_seconds": 300,
    "max_items_per_run": 5
  },
  "paths": {
    "vault_root": ".",
    "workspace_root": ".",
    "harness_root": ".harness",
    "raw_root": "03-Resources/RAW",
    "candidate_roots": ["00-Ideas", "03-Resources"],
    "formal_roots": ["01-Projects", "02-Areas", "04-Archive", "05-Skills"],
    "local_import_dirs": [
      ".harness/inbox"
    ]
  },
  "query_sets": {
    "materials_science": [
      "materials science",
      "additive manufacturing",
      "metal additive manufacturing",
      "laser powder bed fusion",
      "microstructure process property",
      "materials characterization",
      "machine learning materials",
      "phase transformation",
      "corrosion materials",
      "welding metallurgy",
      "energy materials"
    ]
  },
  "sources": [
    {
      "source_id": "zotero-local",
      "adapter": "zotero_local_api",
      "access_mode": "local-api-read-only",
      "domains": ["materials science", "literature"],
      "query_sets": ["materials_science"],
      "schedule": "daily",
      "rate_limit": "local-api",
      "enabled": true,
      "fallback": "03-Resources existing cards",
      "endpoint": "http://127.0.0.1:23119/api/users/0/items",
      "tag": "RKB-C",
      "limit": 100
    },
    {
      "source_id": "local-inbox",
      "adapter": "local_files",
      "access_mode": "local-files-read-only",
      "domains": ["materials science", "user supplied"],
      "query_sets": ["materials_science"],
      "schedule": "daily",
      "rate_limit": "filesystem",
      "enabled": true,
      "fallback": "leave original file in place and report extraction failure",
      "paths_from_registry": "local_import_dirs",
      "extensions": [".md", ".markdown", ".txt", ".html", ".htm", ".json", ".ris", ".bib", ".pdf"]
    },
    {
      "source_id": "official-rss",
      "adapter": "rss",
      "access_mode": "configured-public-feed",
      "domains": ["materials science", "literature"],
      "query_sets": ["materials_science"],
      "schedule": "daily",
      "rate_limit": "feed-defined",
      "enabled": false,
      "fallback": "keep disabled until each feed is reviewed",
      "feed_urls": []
    },
    {
      "source_id": "horizon-signal-staging",
      "adapter": "horizon_staging",
      "access_mode": "local-staging-read-only",
      "domains": ["materials science", "research software"],
      "query_sets": ["materials_science"],
      "schedule": "daily",
      "rate_limit": "local-filesystem",
      "enabled": true,
      "fallback": "record a skipped status until a reviewed Horizon GitHub/X packet exists",
      "staging_root": ".harness/staging/horizon",
      "max_packets": 31,
      "max_packet_age_days": 8,
      "note": "Read only raw packets generated by horizon_fetch_only.py. Horizon external AI, delivery, and direct Vault writes are disabled. X packets are accepted only after local handle review and budget-gated Apify collection; packets with a systemic X error are excluded from weekly intake, while partial account coverage remains a warning and is included in the weekly report. The limits cover a full weekly window without imposing an X entry-count cap."
    },
    {
      "source_id": "x-manual",
      "adapter": "manual_import",
      "access_mode": "user-provided-clip-or-export",
      "domains": ["research signals"],
      "query_sets": ["materials_science"],
      "schedule": "on-demand",
      "rate_limit": "manual",
      "enabled": true,
      "fallback": "put clip/export in .harness\\inbox",
      "note": "No unattended scraping or login bypass."
    },
    {
      "source_id": "cnki-manual",
      "adapter": "manual_import",
      "access_mode": "user-provided-RIS-BibTeX-PDF",
      "domains": ["materials science", "Chinese literature"],
      "query_sets": ["materials_science"],
      "schedule": "on-demand",
      "rate_limit": "manual",
      "enabled": true,
      "fallback": "import through Zotero or .harness\\inbox",
      "note": "No login bypass or unattended crawling."
    },
    {
      "source_id": "sciencedirect-manual",
      "adapter": "manual_import",
      "access_mode": "user-provided-DOI-PDF-or-clip",
      "domains": ["materials science", "literature"],
      "query_sets": ["materials_science"],
      "schedule": "on-demand",
      "rate_limit": "manual",
      "enabled": true,
      "fallback": "import through Zotero or .harness\\inbox",
      "note": "Use DOI/public metadata; do not bypass access controls."
    }
  ]
}
